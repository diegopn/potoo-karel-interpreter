[package]
name = "potoo-karel-interpreter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegopn/potoo-karel-interpreter"
readme = "README.md"
description = "An independent Rust interpreter for the Stanford Java Karel educational programming language."

[lib]
path = "src/lib.rs"

[[bin]]
name = "potoo-karel"
path = "src/bin/potoo-karel.rs"
